aid: finite-state
name: Finite State
description: 'Finite State is a product security platform for connected-device and
  embedded software manufacturers. It performs binary and firmware composition analysis,
  source-code scanning and third-party scan ingestion, SBOM generation and lifecycle
  management (CycloneDX and SPDX), VEX, EPSS- and reachability-based vulnerability
  prioritization, license-policy enforcement, and evidence-backed compliance reporting
  for regimes such as the EU Cyber Resilience Act, FDA 524B, ISO 21434 and IEC 62443.
  Programmatic access is offered through a token-authenticated REST API on the platform
  host, a legacy GraphQL API with an official Python SDK, the fs-cli command-line
  tool, and CI/CD integrations for GitHub Actions, Jenkins and Azure DevOps. Finite
  State also publishes an anonymous, read-only A2A JSON-RPC content API described
  by an agent card at its canonical well-known path.'
