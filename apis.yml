apis:
- aid: finite-state:platform-api
  name: Finite State Platform API
  description: 'Token-authenticated REST API for the Finite State platform, served
    under /api/public/v0 on the platform host. Interactive Swagger documentation is
    published per organization at https://[org].finitestate.io/swagger and the underlying
    OpenAPI document is served at /api/docs/openapi.json. Both the spec and every
    operation sit behind an API token, so no machine-readable contract is retrievable
    anonymously.'
