- aid: finite-state:graphql-api
  name: Finite State GraphQL API
  description: 'GraphQL API historically documented at https://platform.finitestate.io/api/v1/graphql
    and still the transport used by the official Python SDK, which authenticates via
    a client-credentials exchange at /api/v1/auth/token and passes an organization
    context on every request. An anonymous POST to the documented endpoint returned
    404 on 2026-08-04, so the surface is recorded as legacy alongside the newer REST
    API.'
  humanURL: https://github.com/FiniteStateInc/finite-state-sdk-python
