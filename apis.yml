- aid: finite-state:a2a-content-api
  name: Finite State A2A Content API
  description: 'Public, anonymous, read-only JSON-RPC 2.0 API exposing Finite State''s
    published content: blog posts, resources, videos, events, podcasts and press articles.
    Four allowlisted methods (content.list, content.get, content.search, content.metadata)
    are described by an A2A agent card served from the canonical well-known path.
    POST only; GET returns 405.'
  humanURL: https://finitestate.io/.well-known/agent-card.json
  baseURL: https://finitestate.io/api/a2a
  tags:
  - Content
  - Agents
  - A2A
  properties:
